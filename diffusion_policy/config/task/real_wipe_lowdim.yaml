name: real_wipe_lowdim

image_shape: [3, 480, 640]
dataset_path: data/demo_wipe

shape_meta: &shape_meta
  # acceptable types: low_dim
  obs:
    robot_eef_pose:
      shape: [3]
      type: low_dim
    # robot_eef_force:
    #   shape: [6]
    #   type: low_dim
  action: 
    shape: [3]

# Extract dimensions from shape_meta
action_dim: ${shape_meta.action.shape[0]}
obs_dim: ${shape_meta.obs.robot_eef_pose.shape[0]}

env_runner:
  _target_: diffusion_policy.env_runner.real_wipe_lowdim_runner.RealWipeLowdimRunner

dataset:
  _target_: diffusion_policy.dataset.real_lowdim_dataset.RealLowdimDataset
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  n_latency_steps: ${n_latency_steps}
  use_cache: True
  seed: 42
  val_ratio: 0.00
  max_train_episodes: null
  delta_action: False

